<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ет что вообще</title>
    <link rel="icon" href="https://www.flaticon.com/ru/free-icon/cherry_6856501?term=%D0%B2%D0%B8%D1%88%D0%BD%D1%8F&page=1&position=15&origin=search&related_id=6856501" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="rel">
    
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-color: #ffffff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #000;
        }

        .video-background {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 1;
            gap: 15px; /* Удобные отступы между всеми элементами */
        }

        .avatar {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--glass-border);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        /* СТИЛИ ДЛЯ НОВОЙ ШАПКИ АКТИВНОСТИ */
        .activity-card {
            background: var(--glass-bg);
            backdrop-filter: blur(13px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            gap: 20px;
            width: 500px; /* Чуть меньше основной шапки */
            min-height: 80px;
            transition: all 0.3s ease;
        }

        .activity-image {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            object-fit: cover;
            background: rgba(255,255,255,0.1);
            display: none; /* Скрыта по умолчанию, пока нет картинки */
        }

        .activity-info {
            text-align: left;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .activity-title {
            color: var(--text-color);
            font-size: 18px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .activity-details {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Стили для статуса (точка) */
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #747f8d;
            margin-bottom: 5px;
        }

        /* Основная шапка */
        .nickname {
            color: var(--text-color);
            font-size: 32px;
            font-weight: 700;
            text-shadow: 0 3px 10px rgba(0,0,0,0.5);
        }

        .glass-header {
            background: var(--glass-bg);
            backdrop-filter: blur(13px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 15px 80px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 700px; 
            height: 240px;
        }

        .nav-item {
            text-decoration: none;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .nav-item:hover { transform: translateY(-5px); opacity: 0.7; }
        .nav-item i { font-size: 50px; margin-bottom: 10px; }
        .nav-item span { font-size: 22px; text-transform: uppercase; font-weight: 500; }

        .footer-text {
            margin-top: 10px;
            color: var(--text-color);
            font-size: 14px;
            opacity: 0.9;
            background: rgba(0,0,0,0.3);
            padding: 8px 15px;
            border-radius: 50px;
        }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline class="video-background">
        <source src="back.mp4" typeاطе="video/mp4">
    </video>

    <div class="container">
        <!-- Аватар -->
        <img src="avatar.gif" alt="Avatar" class="avatar">

        <!-- НОВАЯ ШАПКА АКТИВНОСТИ (Lanyard) -->
        <div class="activity-card" id="activity-card">
            <img src="" alt="" class="activity-image" id="activity-img">
            <div class="activity-info">
                <div class="status-indicator" id="status-dot"></div>
                <div class="activity-title" id="act-name">Ожидание...</div>
                <div class="activity-details" id="act-details">подключение к discord</div>
            </div>
        </div>

        <!-- Никнейм -->
        <div class="nickname">ikisty</div>

        <!-- Основная навигация -->
        <div class="glass-header">
            <a href="https://cryoproject.t.me" target="_blank" class="nav-item">
                <i class="fa-brands fa-telegram"></i>
                <span>telegram</span>
            </a>
            <a href="https://steamcommunity.com/id/ikisty/" target="_blank" class="nav-item">
                <i class="fa-brands fa-steam"></i>
                <span>steam</span>
            </a>
            <a href="https://discord.com/users/923226710453936148" target="_blank" class="nav-item">
                <i class="fa-brands fa-discord"></i>
                <span>Discord</span>
            </a>
               <a href="https://tracker.gg/valorant/profile/riot/melanchol%D1%83%20kid%23322" target="_blank" class="nav-item">
                <i class="fa-solid fa-crosshairs"></i>
                <span>tracker</span>
            </a>
        </div>
       

        <!-- Подпись -->
        <div class="footer-text">
            Принимаю работу в тг
        </div>
    </div>

    <script>
        const userId = "923226710453936148";
        const statusDot = document.getElementById('status-dot');
        const actName = document.getElementById('act-name');
        const actDetails = document.getElementById('act-details');
        const actImg = document.getElementById('activity-img');

        async function updateLanyard() {
            try {
                const response = await fetch(`https://api.lanyard.rest/v1/users/${userId}`);
                const data = await response.json();

                if (data.success) {
                    const discord = data.data;
                    
                    // 1. Цвет точки статуса
                    const colors = { online: "#43b581", idle: "#43b581", dnd: "#43b581", offline: "#747f8d" };
                    statusDot.style.backgroundColor = colors[discord.discord_status] || "#747f8d";

                    // 2. Проверка активности
                    if (discord.activities.length > 0) {
                        const activity = discord.activities[0];
                        actName.innerText = activity.name;
                        actDetails.innerText = activity.details || "";

                        // 3. Логика картинки (Spotify или Игры)
                        if (activity.type === 2 && activity.spotify) { // Spotify
                            actImg.src = activity.spotify.album.artwork_url;
                            actImg.style.display = "block";
                            actDetails.innerText = activity.spotify.track.name;
                        } else if (activity.assets && activity.assets.large_image) { // Игры с иконкой
                            actImg.src = `aa.jpg`;
                            actImg.style.display = "block";
                        } else {
                            // Если картинки нет, скрываем её
                            actImg.style.display = "none";
                        }
                    } else {
                        // Если ничего не играет
                        actName.innerText = "В сети";
                        actDetails.innerText = "Ничем не занят";
                        actImg.style.display = "none";
                    }
                }
            } catch (e) {
                console.error(e);
                actName.innerText = "Ошибка";
            }
        }

        updateLanyard();
        setInterval(updateLanyard, 15000); // Обновление каждые 15 сек
    </script>
</body>
</html>
